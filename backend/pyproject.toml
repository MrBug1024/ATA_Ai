[project]
name = "ai-hunter-langgraph"
version = "0.1.0"
description = "Unified AI Hunter orchestration and deterministic NPA domain service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "argon2-cffi>=23.1.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "minio>=7.2.7",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pypdf>=6.0.0",
  "psycopg2-binary>=2.9.9",
  "psycopg-binary>=3.3.0",
  "openai>=1.82.0",
  "pyjwt>=2.8.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ai-hunter-api = "ai_hunter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_hunter*"]

[tool.pytest.ini_options]
# Only collect the maintained suite; loose scratch scripts in the repo root
# (test_*.py) hit live services and hang the run.
testpaths = ["tests"]
