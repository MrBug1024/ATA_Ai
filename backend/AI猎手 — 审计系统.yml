            \ \n\n- 真实博弈基数（脱水后债权）：XXX 万元\n- **总回收率 V_net = 去毒净值现值合计 ÷ 真实博弈基数 = XX.X%**\n\
            \n### 3. \U0001F578️ 【黑盒穿透：资金流向拓扑图】\n- 直接使用数据中的 `fund_flow` 结论，输出完整 Mermaid\
