        code: "def main(full_context: str, llm_a_text: str, llm_b_text: str) -> dict:\n\
          \    import re\n    import json\n    \n    # --- 1. 绝对安全的内脏清洗 ---\n    def\
          \ clean_text(text: str) -> str:\n        if not text: return \"\"\n    \
          \    if \"</think>\" in text:\n            text = text.rsplit(\"</think>\"\
          , 1)[-1]\n        elif \"</think\" in text: \n            text = text.rsplit(\"\
          </think\", 1)[-1]\n        text = re.sub(r'<think>.*', '', text, flags=re.DOTALL)\n\
          \        return text.strip()\n\n    clean_a = clean_text(llm_a_text)\n \
          \   clean_b = clean_text(llm_b_text)\n    \n    # --- 2. 安全的 JSON 解析 ---\n\
          \    try:\n        data = json.loads(full_context if full_context else \"\
          {}\")\n    except Exception:\n        data = {}\n\n    # --- 3. 资产对账与防遗漏\
          \ ---\n    actual_re_count = len(data.get(\"real_estate_evaluations\", []))\n\
          \    actual_mine_count = len(data.get(\"mining_evaluations\", []))\n   \
          \ reported_count = len(re.findall(r'\\|\\s*\\d+\\s*\\|', clean_a)) \n  \
          \  \n    warning_msg = \"\"\n    if actual_re_count > 0 and reported_count\
          \ < actual_re_count:\n        warning_msg = f\"\\n\\n> ⚠️ **系统拦截预警**：底层台账共识别到\
          \ {actual_re_count} 项不动产与 {actual_mine_count} 项矿权，但当前报告仅处理了约 {reported_count}\
          \ 项。存在资产遗漏风险，请执行下钻核查或调取原始清单！\"\n\n    # --- 4. SOP 任务无脑双擎提取 ---\n    tasks_list\
          \ = []\n    \n    # 引擎 A：表格解析模式 (针对大模型擅自改用表格的情况)\n    # 匹配类似：| \U0001F534\
          **最高** | **任务01** | **调取采矿...** | 调查组 | 2026-05-15 | 贵州省... |\n    table_pattern\
          \ = r'\\|\\s*[^\\|]*\\s*\\|\\s*\\*?任务\\s*\\d+\\*?\\s*\\|\\s*\\*?([^\\*\\\
          |]+)\\*?\\s*\\|\\s*([^\\|]+)\\s*\\|\\s*([^\\|]+)\\s*\\|\\s*([^\\|]+)\\s*\\\
          |'\n    table_matches = re.finditer(table_pattern, clean_b, re.IGNORECASE)\n\
          \    \n    for match in table_matches:\n        tasks_list.append({\n  \
          \          \"action\": match.group(1).strip(\" *\"),\n            \"role\"\
          : match.group(2).strip(\" *\"),\n            \"deadline\": match.group(3).strip(\"\
          \ *\"),\n            \"deliverable\": match.group(4).strip(\" *\"),\n  \
          \          \"priority\": \"高\" if any(k in match.group(1) for k in [\"刑事\"\
          , \"保全\", \"查封\", \"冻结\", \"撤销\", \"异议\", \"移送\"]) else \"中\"\n        })\n\
          \        \n    # 引擎 B：传统的列表解析模式 (如果引擎 A 没抓到，或者大模型乖乖听话用了列表)\n    if not tasks_list:\n\
          \        list_pattern = r\"任务\\s*\\d+：\\s*\\*?\\[?(.*?)(?:\\]|\\*\\*|\\\
          n).*?(?:执行角色|责任人).*?：\\s*\\*?([^\\n\\*]+).*?(?:推荐时限|时限).*?：\\s*\\*?([^\\\
          n\\*]+).*?(?:验收交付物|交付标准).*?：\\s*\\*?([^\\n\\*]+)\"\n        list_matches\
          \ = re.finditer(list_pattern, clean_b, re.IGNORECASE | re.DOTALL)\n    \
          \    for match in list_matches:\n            tasks_list.append({\n     \
          \           \"action\": match.group(1).strip(\" ]*\"),\n               \
          \ \"role\": match.group(2).strip(\" ]*\"),\n                \"deadline\"\
          : match.group(3).strip(\" ]*\"),\n                \"deliverable\": match.group(4).strip(\"\
          \ ]*\"),\n                \"priority\": \"高\" if any(k in match.group(1)\
          \ for k in [\"刑事\", \"保全\", \"查封\", \"冻结\", \"撤销\", \"异议\", \"申报\"]) else\
          \ \"中\"\n            })\n\n    # --- 5. 绝对安全的返回结构 ---\n    return {\n  \
          \      \"final_report\": clean_a + \"\\n\\n\" + clean_b + warning_msg,\n\
          \        \"tasks_array\": tasks_list if tasks_list else [],\n        \"\
          extracted_task_count\": len(tasks_list)\n    }"
