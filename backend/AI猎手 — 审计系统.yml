    - data:
        code: "import httpx\n\nOCR_BASE = \"https://ocr.rhzy.ai\"\n\ndef main(file_url:\
          \ str, file_name: str = None) -> dict:\n    try:\n        # 1. 下载图片文件\n\
          \        # verify=False 视你的生产环境安全要求而定，如果是受信任源可以保留\n        with httpx.Client(follow_redirects=True,\
          \ timeout=60, verify=False) as client:\n            r = client.get(file_url)\n\
          \            r.raise_for_status()\n            file_bytes = r.content\n\
          \            # 获取实际的 MIME 类型\n            content_type = r.headers.get(\"\
          Content-Type\", \"image/png\")\n\n        # 2. 确定文件名\n        if file_name\
          \ and file_name.strip():\n            filename = file_name\n        else:\n\
          \            # 从 URL 提取文件名，若提取不到则默认为 image.png\n            filename = file_url.split(\"\
          ?\")[0].split(\"/\")[-1] or \"image.png\"\n\n        # 3. 智能补齐图片扩展名\n  \
          \      if \".\" not in filename:\n            if \"jpeg\" in content_type\
          \ or \"jpg\" in content_type:\n                filename += \".jpg\"\n  \
          \          elif \"png\" in content_type:\n                filename += \"\
          .png\"\n            elif \"webp\" in content_type:\n                filename\
          \ += \".webp\"\n            else:\n                filename += \".png\"\
          \ # 默认兜底为 png\n\n        # 4. OCR 请求\n        # 针对图片，通常不需要开启 table_enable（除非是图片里的表格），\n\
          \        # 且 auto_rotate (自动纠偏) 建议设为 true 以提高图片识别率\n        with httpx.Client(timeout=600)\
          \ as client:\n            resp = client.post(\n                f\"{OCR_BASE}/api/parse/sync\"\
          ,\n                files={\"file\": (filename, file_bytes, content_type)},\n\
          \                data={\n                    \"backend\": \"vlm-auto-engine\"\
          ,\n                    \"lang_list\": \"ch\",      # 中文识别\n            \
          \        \"formula_enable\": \"false\",\n                    \"table_enable\"\
          : \"false\", # 图片 OCR 通常关闭表格引擎，除非是专门拍的表格\n                    \"auto_rotate\"\
          : \"true\",   # 图片建议开启自动旋转纠正\n                },\n            )\n      \
          \      resp.raise_for_status()\n            data = resp.json()\n\n     \
          \   # 5. 业务判断\n        if data.get(\"status\") == \"failed\":\n        \
          \    return {\n                \"text\": \"\",\n                \"message\"\
          : f\"图片识别失败: {data.get('error')}\"\n            }\n\n        return {\n\
          \            \"text\": data.get(\"markdown\", \"\"),\n            \"message\"\
          : \"success\"\n        }\n\n    except Exception as e:\n        return {\n\
          \            \"text\": \"\",\n            \"message\": f\"系统错误: {str(e)}\"\
          \n        }"
