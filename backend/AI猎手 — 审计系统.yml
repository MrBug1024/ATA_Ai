    - data:
        code: "import httpx\nimport mimetypes\n\nOCR_BASE = \"https://ocr.rhzy.ai\"\
          \n\ndef main(file_url: str, file_name: str = None) -> dict:\n    try:\n\
          \        # 1. 下载文件\n        with httpx.Client(follow_redirects=True, timeout=60,\
          \ verify=False) as client:\n            r = client.get(file_url)\n     \
          \       r.raise_for_status()\n            file_bytes = r.content\n     \
          \       content_type = r.headers.get(\"Content-Type\", \"\")\n\n       \
          \ # 2. filename\n        if file_name and file_name.strip():\n         \
          \   filename = file_name\n        else:\n            filename = file_url.split(\"\
          ?\")[0].split(\"/\")[-1]\n\n        if not filename:\n            filename\
          \ = \"document\"\n\n        # 3. 强制修正扩展名（关键）\n        if \".\" not in filename:\n\
          \            ext = mimetypes.guess_extension(content_type or \"\")\n   \
          \         filename += ext or \".pdf\"\n\n        # 4. fallback content-type（关键）\n\
          \        if not content_type or content_type == \"application/octet-stream\"\
          :\n            if filename.endswith(\".pdf\"):\n                content_type\
          \ = \"application/pdf\"\n            else:\n                content_type\
          \ = \"image/png\"\n\n        # 5. OCR\n        with httpx.Client(timeout=600)\
          \ as client:\n            resp = client.post(\n                f\"{OCR_BASE}/api/parse/sync\"\
          ,\n                files={\"file\": (filename, file_bytes, content_type)},\n\
          \                data={\n                    \"backend\": \"vlm-auto-engine\"\
          ,\n                    \"lang_list\": \"ch\",\n                    \"formula_enable\"\
          : \"false\",\n                    \"table_enable\": \"true\",   # 只在确认 PDF\
          \ 时用\n                    \"auto_rotate\": \"false\",   # 修复拼写\n       \
          \         },\n            )\n\n            # \U0001F447 打印详细错误（强烈建议加）\n\
          \            if resp.status_code != 200:\n                return {\n   \
          \                 \"text\": \"\",\n                    \"message\": f\"\
          HTTP {resp.status_code}: {resp.text}\"\n                }\n\n          \
          \  data = resp.json()\n\n        if data.get(\"status\") == \"failed\":\n\
          \            return {\n                \"text\": \"\",\n               \
          \ \"message\": f\"OCR失败: {data.get('error')}\"\n            }\n\n      \
          \  return {\n            \"text\": data.get(\"markdown\", \"\"),\n     \
          \       \"message\": \"success\"\n        }\n\n    except Exception as e:\n\
          \        return {\n            \"text\": \"\",\n            \"message\"\
          : f\"系统错误: {str(e)}\"\n        }"
