    - data:
        code: "def main(arg1: list) -> dict:\n    import re\n    \n    # 合并所有文本\n\
          \    full = \"\\n\".join(s for s in arg1 if s) if isinstance(arg1, list)\
          \ else str(arg1 or \"\")\n    \n    if not full.strip():\n        return\
          \ {\"result\": \"未知公司\"}\n    \n    # 优先在前1000字符搜索（覆盖大多数文档开头）\n    search_text\
          \ = full[:1000]\n    \n    # 按优先级定义匹配模式\n    patterns = [\n        # 最优先：明确标识的债务人/借款人/被告\n\
          \        (r'(?:债务人|借款人|被告人?)[：:]\\s*([^\\s\\n，。]+)', \"explicit_debtor\"\
          ),\n        (r'(?:申请人|原告)[：:]\\s*([^\\s\\n，。]+)', \"explicit_plaintiff\"\
          ),\n        # 其次：合同/判决书中的主体\n        (r'(?:合同方|甲方)[：:]\\s*([^\\s\\n，。]+)',\
          \ \"contract_party\"),\n        # 通用：公司名称（包含关键词）\n        (r'([\\u4e00-\\\
          u9fa5]{2,30}(?:有限公司|股份有限公司|有限责任公司|集团|公司|企业|控股|投资|实业|科技|工业))', \"company_name\"\
          ),\n    ]\n    \n    for pattern, pattern_type in patterns:\n        m =\
          \ re.search(pattern, search_text)\n        if m:\n            result = m.group(1).strip()\n\
          \            # 过滤过短或无效的结果\n            if len(result) >= 2 and len(result)\
          \ <= 50:\n                return {\"result\": result}\n    \n    # 如果前1000字符没找到，扩展到整个文本再搜一遍\n\
          \    for pattern, pattern_type in patterns:\n        m = re.search(pattern,\
          \ full)\n        if m:\n            result = m.group(1).strip()\n      \
          \      if len(result) >= 2 and len(result) <= 50:\n                return\
          \ {\"result\": result}\n    \n    return {\"result\": \"未知公司\"}"
