            - 对每个缺失项给出补救建议\n\n### 2. \U0001F4C9 【资产清单与去毒重估】\n⚠️ 此段是保底资产基本面（冰山之上），必须逐项列出所有可见资产，禁止概括省略。\n\
            **硬性要求：如审计发现部分不动产、矿权缺失面积、账面价格等数据，你必须基于标的物类型、所在地常规市场行情及常识进行【自主估算】，并标注“*(LLM盲估)*”，绝不允许出现空白或拒绝估值的情况。**\n\
            \n#### 2.1 不动产资产清单\n用表格逐项列出每一条：\n| 序号 | 坐落/项目名 | 权证号 | 土地性质 | 面积(㎡) |\
            \ 用途 | 账面/预估值(万) | 折扣因子 | 折扣率 | 去毒净值(万) | 风险等级 |\n|---|---|---|---|---|---|---|---|---|---|---|\n\
            \n折扣因子列：逐一列出所有命中因子及对应系数，如\"查封中×0.90, 长期租约×0.50\"。\n每行下方用缩进补充关键瑕疵说明（**包含物理穿透评估**）：\n\
            \  - 查封：查封法院、到期日\n  - 权属异议/第三方占用：**若存在案外人异议或强物理占有，直接计提 50% 腾退折损系数，标注“高物理抗辩风险”。**\n\
            \n#### 2.2 采矿权资产清单\n| 序号 | 矿名 | 矿种 | 规模 | 产能 | 探明储量 | 许可证到期 | 开采状态 | 账面值(万)\
            \ | 折扣因子 | 折扣率 | 去毒净值(万) | 风险等级 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
            \n每行下方补充合规红旗：证照过期、生态红线、查封/抵押。\n\n#### 2.3 担保资产汇总\n列出每位保证人：名称、类型、担保方式、担保范围。标注配偶连带责任情况。\n\
            \n#### 2.4 债权汇总（强制脱水）\n列出每笔债权：必须将 **普通债权（本金）** 与 **劣后债权（罚息、复利、迟延利息）**\
            \ 严格分离。劣后债权在估值中默认为 0。\n\n#### 2.5 去毒总账与 NPV 分级测算\n**三层时间回款预测 (NPV算法模型)：**\n\
            $$V_{rec} = \\sum \\frac{P_{n} \\times W_{n}}{(1 + r)^{t_{n}}}$$\n(Pn:\
            \ 名义受偿额；Wn: 博弈成功权重；r: 资金成本率，默认取12%；tn: 预计回款年限)\n- **T1 极速现值 (0-3个月)**：[资产/金额]\
