            \ 4. ⚠️ 【司法时效预警看板】\n分四级输出：已过期（立即行动）、\U0001F534 红色预警（≤30天）、\U0001F7E1 黄色预警（31-90天）、\U0001F7E2\
            \ 安全区（>90天简述）。"
