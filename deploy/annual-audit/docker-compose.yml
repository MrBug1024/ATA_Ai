name: ata-annual-audit-runtime

x-runtime-env: &runtime_env
  env_file:
    - ../../backend/.env

x-runtime-build: &runtime_build
  context: ../../backend

services:
  gotenberg:
    image: gotenberg/gotenberg:8.30.0@sha256:d3c9e0ed2450c9a4631de6d14b51c75fd6051512c33aa8a6df622f085592c48b
    container_name: ata-annual-gotenberg
    restart: unless-stopped
    profiles: [runtime]
    command: [gotenberg, --api-timeout=120s, --chromium-deny-list=.*, --libreoffice-restart-after=10]
    ports: ["${ATTACHMENT_GOTENBERG_PORT:-63000}:3000"]
    tmpfs: [/tmp:size=512m,mode=1770]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [annual_runtime]

  clamav:
    image: clamav/clamav:stable@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    container_name: ata-annual-clamav
    restart: unless-stopped
    profiles: [runtime]
    ports: ["${ATTACHMENT_CLAMAV_PORT:-63310}:3310"]
    volumes: [annual_clamav_data:/var/lib/clamav]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'PING\n' | nc 127.0.0.1 3310 | grep -q PONG &&
          find /var/lib/clamav -type f \( -name '*.cvd' -o -name '*.cld' \)
          -mtime -3 -print -quit | grep -q .
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [annual_runtime]

  attachment-worker:
    build: *runtime_build
    image: ata-annual-attachment-runtime:${ATTACHMENT_RUNTIME_IMAGE_TAG:-local}
    container_name: ata-annual-attachment-worker
    restart: unless-stopped
    profiles: [runtime]
    command:
      - celery
      - -A
      - ai_hunter.app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=annual-attachments
      - "--concurrency=${ATTACHMENT_WORKER_CONCURRENCY:-2}"
      - --hostname=attachment-worker@%h
    depends_on:
      gotenberg: {condition: service_healthy}
      clamav: {condition: service_healthy}
    <<: *runtime_env
    environment: &attachment_runtime_environment
      ATTACHMENT_CLAMAV_HOST: clamav
      ATTACHMENT_CLAMAV_PORT: 3310
      ATTACHMENT_CLAMAV_REQUIRED: "true"
      ATTACHMENT_GOTENBERG_URL: http://gotenberg:3000
      ATTACHMENT_PREVIEW_REQUIRED: "true"
      ATTACHMENT_PREVIEW_MAX_MB: ${ATTACHMENT_PREVIEW_MAX_MB:-200}
      ATTACHMENT_JOB_STALE_SECONDS: ${ATTACHMENT_JOB_STALE_SECONDS:-900}
      ATTACHMENT_PDF_FONT_ROOT: /usr/share/fonts
    read_only: true
    tmpfs: [/tmp:size=1g,mode=1770]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m ai_hunter.annual_audit.scripts.verify_attachment_runtime &&
          python -m ai_hunter.app.scripts.check_storage_readiness &&
          celery -A ai_hunter.app.workers.celery_app:celery_app inspect ping
          --destination "attachment-worker@$${HOSTNAME}" --timeout=5 | grep -q pong
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks: [annual_runtime]

  attachment-beat:
    build: *runtime_build
    image: ata-annual-attachment-runtime:${ATTACHMENT_RUNTIME_IMAGE_TAG:-local}
    container_name: ata-annual-attachment-beat
    restart: unless-stopped
    profiles: [runtime]
    command:
      - celery
      - -A
      - ai_hunter.app.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    <<: *runtime_env
    environment: *attachment_runtime_environment
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1770]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [annual_runtime]

  annual-api:
    build: *runtime_build
    image: ata-annual-attachment-runtime:${ATTACHMENT_RUNTIME_IMAGE_TAG:-local}
    container_name: ata-annual-api
    restart: unless-stopped
    profiles: [runtime]
    command: [python, -m, ai_hunter]
    depends_on:
      gotenberg: {condition: service_healthy}
      clamav: {condition: service_healthy}
      attachment-worker: {condition: service_healthy}
    <<: *runtime_env
    environment:
      <<: *attachment_runtime_environment
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      LOG_DIR: /app/logs
    ports: ["${ANNUAL_BACKEND_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp:size=512m,mode=1770, /app/logs:size=128m,mode=1770]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [annual_runtime]

volumes:
  annual_clamav_data:
    name: ata-annual-clamav-data

networks:
  annual_runtime:
    name: ata-annual-runtime
